[package]
name = "kon-app"
version = "0.1.0"
edition = "2021"
description = "KON: unified desktop application integrating independent compression engines"

[dependencies]
# PKON is the first engine. Its Cargo package is still named `nanoscope`; alias it locally as `pkon`.
pkon = { package = "nanoscope", path = "../pkon" }
# Per-user config/data/cache locations (XDG on Linux, Known Folders on Windows, ~/Library on macOS).
directories = "5"
# PNG writer for viewer previews and exports (PKON has no PNG output API). Already in the tree via PKON's `image` dependency.
png = "0.18"
