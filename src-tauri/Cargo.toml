[package]
name = "kon-desktop"
version = "0.1.0"
edition = "2021"
description = "KON desktop shell (Tauri 2) over kon-app's JobRunner"

# Standalone workspace: keeps Tauri (and its WebView system deps) out of the core crate's cargo/CI graph.
[workspace]

[dependencies]
kon-app = { path = ".." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = "thin"
