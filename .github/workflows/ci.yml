name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Apple Silicon is non-blocking for now; every other OS in the matrix stays blocking.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false # a failure on one OS must not hide results from the others
      matrix:
        # macos-26-intel = Intel x86_64, macos-latest = Apple Silicon arm64, ubuntu = x86_64 Linux.
        # (Linux arm64 and Windows arm64 runners are not included yet.)
        os: [windows-latest, ubuntu-latest, macos-26-intel, macos-latest]
    defaults:
      run:
        working-directory: kon-app
    steps:
      - name: Checkout kon-app
        uses: actions/checkout@v4
        with:
          path: kon-app

      # kon-app depends on PKON via `path = "../pkon"`, so PKON must be a sibling directory.
      - name: Checkout PKON
        uses: actions/checkout@v4
        with:
          repository: Kernel-of-Optimized-Networks-KON/pkon
          path: pkon

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kon-app

      - run: cargo fmt --check
      - run: cargo check --all-targets
      # Includes the cross-platform determinism test: ELLIE output must be byte-identical to the pinned Windows build.
      - run: cargo test
