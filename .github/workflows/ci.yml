name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Apple Silicon is non-blocking for now; every other OS in the matrix stays blocking.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false # a failure on one OS must not hide results from the others
      matrix:
        # macos-26-intel = Intel x86_64, macos-latest = Apple Silicon arm64, ubuntu = x86_64 Linux.
        # (Linux arm64 and Windows arm64 runners are not included yet.)
        os: [windows-latest, ubuntu-latest, macos-26-intel, macos-latest]
    defaults:
      run:
        working-directory: kon-app
    steps:
      - name: Checkout kon-app
        uses: actions/checkout@v4
        with:
          path: kon-app

      # kon-app depends on PKON via `path = "../pkon"`, so PKON must be a sibling directory.
      - name: Checkout PKON
        uses: actions/checkout@v4
        with:
          repository: Kernel-of-Optimized-Networks-KON/pkon
          path: pkon

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kon-app

      # DNG ingestion (and the native-vs-Python oracle test) shells out to PKON's Python reader.
      - name: Install Python (for PKON DNG ingestion)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.4.4 tifffile==2026.10.15 imagecodecs==2026.10.10

      # Real DNG corpus (50 files, ~1.1 GB, raw.pixls.us). Pinned by sha256 in tests/fixtures/dng-corpus.tsv.
      - name: Cache DNG corpus
        uses: actions/cache@v4
        with:
          path: dng-corpus
          key: dng-corpus-${{ hashFiles('kon-app/tests/fixtures/dng-corpus.tsv') }}
      - name: Fetch DNG corpus
        working-directory: .
        run: python kon-app/tools/fetch_dng_corpus.py dng-corpus

      - run: cargo fmt --check
      - run: cargo check --all-targets
      # Includes the cross-platform determinism test: ELLIE output must be byte-identical to the pinned Windows build.
      - run: cargo test
        env:
          KON_TEST_FIXTURES: ${{ github.workspace }}/kon-app/tests/fixtures/small
          KON_TEST_DNG_DIR: ${{ github.workspace }}/dng-corpus
